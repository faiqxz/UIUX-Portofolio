<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- LinkedIn cover image, 1584x396 (4:1). The profile photo covers roughly the bottom-left
     400x220 px on desktop, so everything important starts at x = 440.
     Render: chrome --headless=new --hide-scrollbars --window-size=1584,396 --virtual-time-budget=12000
             --allow-file-access-from-files --screenshot=linkedin-banner.png branding/linkedin-banner.html
     (add --force-device-scale-factor=2 for the sharper 3168x792 version) -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@500;600&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    position: relative; color: #F6F1E7;
    background: radial-gradient(85% 150% at 74% 0%, #3123B5 0%, #1A1360 45%, #120D45 74%, #0F0B3A 100%);
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  .stars { position: absolute; inset: 0; opacity: .7;
    background-image:
      radial-gradient(1.6px 1.6px at 40px 60px, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 130px 150px, #B3A9FF 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 210px 40px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 90px 210px, #fff 50%, transparent 51%);
    background-size: 260px 240px; }
  .glow { position: absolute; right: 30px; top: -40px; width: 620px; height: 460px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(108,92,255,.5) 0%, transparent 66%); }

  .copy { position: absolute; left: 440px; top: 40px; }
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: rgba(246,241,231,.75); line-height: 1.65; }
  .mono b { color: #FF3D81; font-weight: 700; }
  .name { color: #F6F1E7; font-size: 19px; }
  h1 { margin-top: 16px; font-family: Anton, sans-serif; font-weight: 400; font-size: 100px; line-height: .86; text-transform: uppercase; white-space: nowrap; }
  .hot { color: #FF3D81; }
  .outline { color: transparent; -webkit-text-stroke: 2.5px #F6F1E7; }
  .sub { margin-top: 18px; font-size: 22px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
  .cyan { color: #3DE3F2; }

  .phones { position: absolute; right: 56px; top: 30px; width: 420px; height: 420px; }
  .phones img { position: absolute; width: 176px; filter: drop-shadow(0 20px 34px rgba(0,0,0,.45)); }
  .p1 { left: 10px; top: 52px; transform: rotate(-8deg) scale(.88); transform-origin: bottom center; }
  .p3 { right: 10px; top: 52px; transform: rotate(8deg) scale(.88); transform-origin: bottom center; }
  .p2 { left: 122px; top: 0; z-index: 2; }

  .doodle { position: absolute; }
  .ring { left: 1010px; top: 46px; width: 38px; height: 38px; border: 5px solid #FF3D81; border-radius: 50%; }
  .sq { left: 1000px; top: 236px; width: 26px; height: 26px; border: 5px solid #FFC93C; border-radius: 4px; transform: rotate(18deg); }
  .cloud { position: absolute; left: 0; bottom: -2px; width: 1584px; height: 70px; z-index: 3; }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="glow"></div>

  <!-- Top-left doodles sit above the profile photo -->

  <svg class="doodle" style="left:250px;top:44px" width="66" height="33" viewBox="0 0 56 28" fill="none"><path d="M3 23 14 5l11 18L36 5l11 18" stroke="#FFC93C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="doodle" style="left:176px;top:118px" width="26" height="26" viewBox="0 0 30 30" fill="none"><path d="M15 4v22M4 15h22" stroke="#FF3D81" stroke-width="5" stroke-linecap="round"/></svg>
